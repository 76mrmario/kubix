apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubix
  labels:
    app: kubix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kubix
  template:
    metadata:
      labels:
        app: kubix
    spec:
      containers:
        - name: kubix
          image: ghcr.io/76mrmario/kubix:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
